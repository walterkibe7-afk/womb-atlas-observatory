services:
  mysql:
    image: mysql:8.4
    container_name: womb_atlas_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wombatlas_db
      MYSQL_USER: womb_atlas
      MYSQL_PASSWORD: womb_atlas_password
      MYSQL_ROOT_PASSWORD: womb_atlas_root_password
    ports:
      - "3306:3306"
    volumes:
      - womb_atlas_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pwomb_atlas_root_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  womb_atlas_mysql_data:
